<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui" />
        <link type="text/css" rel="stylesheet" href="main.css"/>
        <script src="types.js"></script>
        <script src="consts.js"></script>
        <script src="data.js"></script>
        <script src="lib.js"></script>
        <script src="gfx.js"></script>
        <script src="leaderboard.js"></script>
        <script src="puzzle.js"></script>
        <script src="game.js"></script>
        <script src="background.js"></script>
        <script src="main.js"></script>
    </head>
    <body>
        <svg viewBox="0 0 1080 1080" version="1.1" xmlns="http://www.w3.org/2000/svg" id="bg" preserveAspectRatio="xMidYMid slice">
            <path d="M 0 0 H 1080 V 1080 H 0 Z" style="fill:#012"></path>
        </svg>
        <div id="b"></div><!-- background/content -->
        <div id="m"><!-- puzzle menu button -->
            <div id="ma">&#x2630;</div><!-- menu open button -->
        </div>
        <div id="o">
            <div id="oa">1</div>
            <div id="ob">2</div>
            <div id="oc">3</div>
            <div id="od">C</div>
        </div>
        <div id="h"></div><!-- hint -->
        <div id="n" class="m"><!-- puzzle menu -->
            <div id="a1">Restart puzzle</div><!-- back button -->
            <div id="a2">Leave puzzle</div><!-- back button -->
            <div id="a3">Peek<br/><span>When you peek the solution will be shown and you will be limited to a <b>one star</b> result.</span></div><!-- back button -->
            <div id="a4">Back</div><!-- back button -->
        </div>
        <div id="w" class="m">
            <span id="p1"></span><!-- win message -->
            <div id="a9">Continue</div><!-- back button -->
        </div>
    </body>
</html>
